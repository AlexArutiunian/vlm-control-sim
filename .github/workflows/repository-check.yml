name: Repository check

on:
  push:
    branches:
      - main
      - cleanup/repo-structure
  pull_request:
    branches:
      - main

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run repository check
        run: bash checks/repository.sh
